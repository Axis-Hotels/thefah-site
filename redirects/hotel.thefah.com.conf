# hotel.thefah.com → axis-hotels.com/en/fah (language first, like the rest of axis-hotels.com)
#
# Old site (English only, 2016–2021): every old address keeps its meaning and its language.
# Pages of the old site and where they go now:
#   /, /index.html, /home                     → /en/fah                    (home)
#   /accommodation.html, /accomodation        → /en/fah#fah-rooms             (rooms)
#   /gallery.html, /gallary                   → /en/fah#fah-rooms             (room photos sit in the room cards)
#   /gallery_content.html?gallery=<room>      → /en/fah#fah-<that room>       (see map below)
#   /facilities.html, /facilities             → /en/fah#fah-hotel             (amenities)
#   /contact.html, /contactus                 → /en/fah#fah-contacts          (contacts)
#   /promotion.html, /promotion, /specialoffer/* → booking page of the Fah  (offers and rates)
#   anything under /ru/ or /th/               → /ru/fah or /th/fah         (in case such links exist)
#   anything else                             → /en/fah
#
# Install: put this file into /etc/nginx/conf.d/ (or include it from the server's config),
# remove the "Website coming soon" server block for hotel.thefah.com, then:
#   sudo nginx -t && sudo systemctl reload nginx
# For https://hotel.thefah.com the server needs a certificate for this name, for example:
#   sudo certbot --nginx -d hotel.thefah.com
# (certbot adds the ssl lines to the 443 server below by itself).
#
# Source: github.com/Axis-Hotels/thefah-site, redirects/hotel.thefah.com.conf

map $uri $fah_target {
    default                         "/en/fah";

    ~^/(index\.html?|home)?/?$       "/en/fah";

    ~^/(accommodation|accomodation)(\.html)?/?$   "/en/fah#fah-rooms";
    ~^/(gallery|gallary)(\.html)?/?$              "/en/fah#fah-rooms";
    ~^/facilities(\.html)?/?$                     "/en/fah#fah-hotel";
    ~^/(contact|contactus)(\.html)?/?$            "/en/fah#fah-contacts";
    ~^/(promotion(\.html)?|specialoffer)(/.*)?$   "/en/bangkok/booking?hotel_id=515836";

    ~^/ru(/.*)?$                    "/ru/fah";
    ~^/th(/.*)?$                    "/th/fah";
    ~^/en(/.*)?$                    "/en/fah";
}

# gallery_content.html?gallery=<room>-picture: the old per-room photo galleries
map $arg_gallery $fah_gallery {
    default                         "/en/fah#fah-rooms";
    superior-double-bed-picture     "/en/fah#fah-standard-double";
    deluxe-twin-picture             "/en/fah#fah-deluxe-twin";
    deluxe-kingsize-picture         "/en/fah#fah-deluxe-double";
    penthouse-picture               "/en/fah#fah-penthouse-suite";
    hotel-picture                   "/en/fah#fah-hotel";
}

server {
    listen 80;
    listen [::]:80;
    server_name hotel.thefah.com;

    location = /gallery_content.html {
        return 301 https://axis-hotels.com$fah_gallery;
    }
    location / {
        return 301 https://axis-hotels.com$fah_target;
    }
}

